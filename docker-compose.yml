version: "3.9"

services:
  # ===========================================================================
  # PostgreSQL Database Service
  # ===========================================================================
  fresco-db:
    image: postgres:16-alpine
    container_name: fresco-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fresco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fresco_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-fresco}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - fresco_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fresco -d fresco"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # FRESCO FastAPI Backend Service
  # ===========================================================================
  fresco-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fresco-backend
    restart: unless-stopped
    depends_on:
      fresco-db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-fresco}:${POSTGRES_PASSWORD:-fresco_secure_password}@fresco-db:5432/${POSTGRES_DB:-fresco}
      - SECRET_KEY=${SECRET_KEY:-fresco_jwt_super_secret_production_key_2026}
      - DEBUG=False
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - fresco_uploads:/app/uploads
      - ./backend/models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  fresco_pgdata:
    driver: local
  fresco_uploads:
    driver: local
